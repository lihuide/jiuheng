[workspace]
members = [
    "crates/divination-core",
    "crates/divination-storage",
    "apps/desktop",
]
resolver = "2"

[workspace.package]
version = "0.79.0"
edition = "2021"
license = "LicenseRef-Proprietary"
authors = ["Jiuheng Contributors"]

[workspace.dependencies]
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "persistence"] }
rand = "0.9"
rand_chacha = "0.9"
rusqlite = { version = "0.37", features = ["bundled", "chrono", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.17", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
